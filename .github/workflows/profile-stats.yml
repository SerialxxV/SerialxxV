name: Update GitHub Profile Stats

on:
  schedule:
    # Every day at 00:00 UTC.
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=SerialxxV
            &show_icons=true
            &hide_border=true
            &bg_color=0d1117
            &title_color=c084fc
            &text_color=c9d1d9
            &icon_color=a855f7
            &ring_color=a855f7
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=SerialxxV
            &layout=compact
            &langs_count=8
            &size_weight=0.5
            &count_weight=0.5
            &hide_border=true
            &bg_color=0d1117
            &title_color=c084fc
            &text_color=c9d1d9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "Stats have not changed."
            exit 0
          fi

          git commit -m "chore: update profile stats"
          git push
